version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - DATABASE_URL=sqlite:///./aegis_grc.db
      - ENVIRONMENT=production
      - LOG_LEVEL=info
    volumes:
      - aegis_data:/data
    restart: always

volumes:
  aegis_data:
